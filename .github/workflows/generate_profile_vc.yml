name: Generate Profile Visual Card

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari pukul 00:00 UTC
  workflow_dispatch: # Memungkinkan eksekusi manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan untuk melakukan push commit kembali

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVG Cards
        run: python today.py

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update profile visual cards" && git push)
